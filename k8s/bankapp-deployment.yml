apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankapp-deployment
  namespace: bankapp-ns
  labels:
    app: bankapp

spec:
  replicas: 2
  selector:
    matchLabels:
      app: bankapp

  template:
    metadata:
      labels:
        app: bankapp

    spec:
      containers:
        - name: bankapp
          image: trainwithshubham/ai-bankapp:latest
          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: bankapp-configmap

            - secretRef:
                name: bankapp-secrets   
             
