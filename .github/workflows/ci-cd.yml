name: CI/CD - Build, Push & Deploy BankApp

on:
    push:
        branches:
            - master
            - kanha
    pull_request:
        branches:
            - master
            - kanha

env:
    IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/bankapp

jobs:
    # ─────────────────────────────────────────────
    # JOB 1: Build & Test with Maven
    # ─────────────────────────────────────────────
    build-and-test:
        name: 🔨 Build & Test (Maven)
        runs-on: ubuntu-latest

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4

            - name: ☕ Set up Java 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: maven

            - name: 🔧 Make mvnw executable
              run: chmod +x mvnw

            - name: 🧪 Run tests & build JAR
              run: ./mvnw clean package -DskipTests
              # Note: Change -DskipTests to run tests if you have a test DB configured

            - name: 📦 Upload JAR artifact
              uses: actions/upload-artifact@v4
              with:
                  name: bankapp-jar
                  path: target/*.jar
                  retention-days: 7

    # ─────────────────────────────────────────────
    # JOB 2: Build & Push Docker Image
    # ─────────────────────────────────────────────
    docker-build-push:
        name: 🐳 Build & Push Docker Image
        runs-on: ubuntu-latest
        needs: build-and-test
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'

        steps:
            - name: 📥 Checkout code
              uses: actions/checkout@v4

            - name: 🔑 Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: 🏷️ Set Docker image tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest
                      type=sha,prefix=sha-,format=short

            - name: 🛠️ Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: 🚀 Build and Push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # ─────────────────────────────────────────────
    # JOB 3: Deploy to Server via SSH
    # ─────────────────────────────────────────────
    deploy:
        name: 🚀 Deploy to Server
        runs-on: ubuntu-latest
        needs: docker-build-push
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'

        steps:
            - name: 📥 Checkout code (for docker-compose.yml)
              uses: actions/checkout@v4

            - name: 🔐 Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  port: ${{ secrets.SERVER_PORT || 22 }}
                  script: |
                      # Pull latest image
                      docker pull ${{ env.IMAGE_NAME }}:latest

                      # Navigate to app directory (update this path if needed)
                      cd ~/bankapp || mkdir -p ~/bankapp && cd ~/bankapp

                      # Write docker-compose.yml from repo
                      cat > docker-compose.yml << 'COMPOSE_EOF'
                      services:
                        mysql:
                          image: mysql:8.0
                          container_name: mysql
                          environment:
                            MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
                            MYSQL_DATABASE: bankappdb
                          healthcheck:
                            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${{ secrets.MYSQL_ROOT_PASSWORD }}"]
                            interval: 10s
                            timeout: 5s
                            retries: 5
                            start_period: 30s
                          ports:
                            - "3306:3306"
                          volumes:
                            - mysql-data:/var/lib/mysql
                          networks:
                            - bankapp-network

                        bankapp:
                          image: ${{ env.IMAGE_NAME }}:latest
                          container_name: bankapp
                          ports:
                            - "8080:8080"
                          environment:
                            MYSQL_HOST: mysql
                            MYSQL_PORT: 3306
                            MYSQL_DATABASE: bankappdb
                            MYSQL_USER: root
                            MYSQL_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
                          depends_on:
                            mysql:
                              condition: service_healthy
                            ollama:
                              condition: service_started
                          networks:
                            - bankapp-network

                        ollama:
                          image: ollama/ollama:latest
                          container_name: ollama
                          ports:
                            - "11434:11434"
                          networks:
                            - bankapp-network

                      networks:
                        bankapp-network:
                          driver: bridge
                      volumes:
                        mysql-data:
                      COMPOSE_EOF

                      # Restart services with new image
                      docker compose down --remove-orphans
                      docker compose up -d

                      # Remove dangling images to save space
                      docker image prune -f

                      echo "✅ Deployment complete!"
